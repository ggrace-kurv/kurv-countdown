<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="Race to the Summit">

  <meta property="og:url" content="https://ggrace-kurv.github.io/kurv-countdown/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
  </style>
</head>
<body>
<div id="cd" style="font-family:'Plus Jakarta Sans',sans-serif;text-align:center;padding:24px;background:#E8F9CE;color:#1B5E4E;border-radius:12px">
  <div style="font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#333138">Race to the Summit</div>
  <div id="t" style="font-size:44px;font-weight:700;margin-top:6px">--</div>
</div>
<script>
  const target = new Date("2026-10-31T09:00:00-04:00"); // 9:00 AM EDT
  const el = document.getElementById("t");
  let timer;
  function tick() {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    if (s === 0) { el.textContent = "Live"; el.style.color = "#FFA601"; clearInterval(timer); return; }
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600);  s %= 3600;
    const m = Math.floor(s / 60);    s %= 60;
    el.textContent = `${d}d ${h}h ${m}m ${s}s`;
  }
  tick(); timer = setInterval(tick, 1000);
</script>
</body>
</html>
